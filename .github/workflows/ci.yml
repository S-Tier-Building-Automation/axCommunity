name: CI

on:
  push:
    branches: [main]
    paths:
      - 'N4/**'
      - '.github/workflows/ci.yml'
  # No paths filter on pull_request: "CI Gate" is a required status check, and a
  # required check that never reports leaves auto-merge waiting forever on PRs
  # that don't touch N4/ (e.g. Dependabot action bumps, docs). smoke-check is a
  # fast hosted job and build-niagara stays skipped unless NIAGARA_BUILD_ENABLED.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Hosted structural smoke check.
  #
  # A genuine `./gradlew assemble` is NOT possible on a stock GitHub-hosted
  # runner: the Tridium Gradle plugins (niagara-module-plugin, etc.) and every
  # module dependency resolve from the local Niagara install (etc/m2/repository,
  # bin/ext, modules). settings.gradle THROWS during settings evaluation when
  # `niagara_home` is unset, before any task can run. A Niagara install is not
  # redistributable, so this job only validates the wrapper + build layout. The
  # real compile/sign happens in build-niagara (self-hosted) below.
  # ---------------------------------------------------------------------------
  smoke-check:
    name: Build Layout Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify N4 build scripts are present
        run: |
          set -euo pipefail
          fail=0
          echo "== Required build files =="
          for f in \
            N4/settings.gradle \
            N4/build.gradle \
            N4/vendor.gradle \
            N4/gradle/niagara.gradle \
            N4/gradle/signing.gradle \
            N4/axCommunity-rt/axCommunity-rt.gradle \
            N4/axCommunity-wb/axCommunity-wb.gradle \
            N4/axCommunity-ux/axCommunity-ux.gradle \
            N4/axCommunity-doc/axCommunity-doc.gradle \
            N4/gradlew \
            N4/gradle/wrapper/gradle-wrapper.jar
          do
            if [[ -f "$f" ]]; then echo "  ok   $f"; else echo "  MISS $f"; fail=1; fi
          done
          [[ "$fail" -eq 0 ]] || { echo "::error::N4 build layout smoke check failed"; exit 1; }
          echo "Structural smoke check passed."

      - name: Niagara compile gate status
        run: |
          echo "::notice::axCommunity Java is NOT compiled here — a real compile+sign" \
               "gate runs on a self-hosted runner with the OLDEST supported Niagara" \
               "(4.10.x) installed so jars stay forward-compatible (build-niagara job," \
               "enable via the NIAGARA_BUILD_ENABLED repo variable)."

  # ---------------------------------------------------------------------------
  # Real compile + sign on a self-hosted Windows runner with Niagara installed.
  #
  # DORMANT until you opt in: set repo variable NIAGARA_BUILD_ENABLED=true and
  # register a self-hosted runner labelled `niagara-build` to this repo, with
  # repo variable NIAGARA_HOME (and optionally NIAGARA_USER_HOME) pointing at the
  # OLDEST supported Niagara install (4.10.x) — compiling there keeps the jars
  # forward-compatible (load on 4.10 through 4.15+). The runner also needs a full
  # JDK 8 (with jarsigner) on JAVA_HOME; a Niagara JRE alone has no jarsigner.
  # Until then this job is skipped (so it never queues forever waiting on a
  # runner that doesn't exist).
  # ---------------------------------------------------------------------------
  build-niagara:
    name: Niagara Build (assemble + sign)
    needs: smoke-check
    # Fork PRs must NEVER run here: this job executes the PR's own gradlew.bat
    # and Gradle scripts on the self-hosted runner — for a fork that is arbitrary
    # code execution on the machine that also holds the official signing cert.
    # Same-repo PRs and pushes only. Maintainers can still build a fork PR by
    # pulling the branch into a same-repo PR after review.
    if: ${{ vars.NIAGARA_BUILD_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, niagara-build]
    timeout-minutes: 30
    env:
      NIAGARA_HOME: ${{ vars.NIAGARA_HOME }}
      NIAGARA_USER_HOME: ${{ vars.NIAGARA_USER_HOME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve + validate Niagara paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NIAGARA_HOME)) {
            $env:NIAGARA_HOME = [Environment]::GetEnvironmentVariable('NIAGARA_HOME','Machine')
          }
          if ([string]::IsNullOrWhiteSpace($env:NIAGARA_HOME)) {
            $env:NIAGARA_HOME = [Environment]::GetEnvironmentVariable('NIAGARA_HOME','User')
          }
          if ([string]::IsNullOrWhiteSpace($env:NIAGARA_USER_HOME)) {
            $env:NIAGARA_USER_HOME = [Environment]::GetEnvironmentVariable('NIAGARA_USER_HOME','User')
          }
          if ([string]::IsNullOrWhiteSpace($env:NIAGARA_HOME)) {
            throw "NIAGARA_HOME is unset. Set the NIAGARA_HOME repo variable or a machine/user env var on the runner."
          }
          if (-not (Test-Path $env:NIAGARA_HOME)) { throw "NIAGARA_HOME does not exist: $env:NIAGARA_HOME" }
          $jre = Join-Path $env:NIAGARA_HOME "jre\bin\java.exe"
          if (-not (Test-Path $jre)) { throw "Expected Niagara JRE at $jre" }
          "NIAGARA_HOME=$($env:NIAGARA_HOME)" >> $env:GITHUB_ENV
          # Signing needs jarsigner, which a Niagara JRE does NOT bundle. Prefer a
          # full JDK 8 for JAVA_HOME (it provides javac AND jarsigner). Order:
          # existing JAVA_HOME if it has jarsigner, then the NIAGARA_JDK_HOME repo
          # var, else fall back to the Niagara JRE (compiles, but signing.gradle
          # must then locate jarsigner via -Psigning.jdkHome).
          $jdk = $null
          foreach ($cand in @($env:JAVA_HOME, '${{ vars.NIAGARA_JDK_HOME }}')) {
            if (-not [string]::IsNullOrWhiteSpace($cand) -and (Test-Path (Join-Path $cand 'bin\jarsigner.exe'))) { $jdk = $cand; break }
          }
          if ($jdk) { "JAVA_HOME=$jdk" >> $env:GITHUB_ENV }
          else {
            Write-Host "::warning::No JDK with jarsigner found; using Niagara JRE for compile. Set the NIAGARA_JDK_HOME repo var to a JDK 8 so signing works."
            "JAVA_HOME=$($env:NIAGARA_HOME)\jre" >> $env:GITHUB_ENV
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NIAGARA_USER_HOME)) {
            "NIAGARA_USER_HOME=$($env:NIAGARA_USER_HOME)" >> $env:GITHUB_ENV
          }

      - name: Write N4/gradle.properties.local
        shell: pwsh
        run: |
          $lines = @("niagara_home=$($env:NIAGARA_HOME -replace '\\','/')")
          if (-not [string]::IsNullOrWhiteSpace($env:NIAGARA_USER_HOME)) {
            $lines += "niagara_user_home=$($env:NIAGARA_USER_HOME -replace '\\','/')"
          }
          # With no signing.* set, gradle/signing.gradle signs with an
          # auto-generated self-signed dev cert (alias axCommunityDev) via
          # jarsigner. Official signing is handled by release-build.yml.
          Set-Content -Path N4/gradle.properties.local -Value $lines -Encoding ASCII
          Get-Content N4/gradle.properties.local

      - name: Assemble + sign module parts
        shell: pwsh
        working-directory: N4
        # clean and assemble as separate invocations: with the Gradle 4.10.x
        # toolchain a combined `clean assemble` can run clean out of order.
        run: |
          .\gradlew.bat clean --no-daemon --console=plain
          .\gradlew.bat assemble --no-daemon --console=plain

      - name: Verify jar signatures
        shell: pwsh
        working-directory: N4
        # Fail fast if any part came out unsigned / mis-signed (mirrors the local
        # dev-loop gate in scripts/build-and-restart.ps1). release-build.yml adds
        # the stricter trusted-fingerprint check for official releases.
        run: |
          $jarsigner = Join-Path $env:JAVA_HOME 'bin\jarsigner.exe'
          if (-not (Test-Path $jarsigner)) { throw "jarsigner not found under JAVA_HOME ($env:JAVA_HOME); a full JDK 8 is required." }
          $fail = $false
          foreach ($p in 'rt','wb','ux','doc') {
            $jar = "axCommunity-$p/build/libs/axCommunity-$p.jar"
            if (-not (Test-Path $jar)) { Write-Host "::error::missing $jar"; $fail = $true; continue }
            $out = & $jarsigner -verify $jar 2>&1 | Out-String
            if ($out -match 'jar verified') { Write-Host "OK  $jar" }
            else { Write-Host "::error::$jar is not signed/verified"; $fail = $true }
          }
          if ($fail) { throw "Signature verification failed." }

      - name: Upload signed module jars
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axCommunity-modules-${{ github.run_id }}
          path: N4/axCommunity-*/build/libs/*.jar
          if-no-files-found: warn

  ci-gate:
    name: CI Gate
    if: always()
    needs: [smoke-check, build-niagara]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          # smoke-check must always pass.
          if [[ "${{ needs.smoke-check.result }}" != "success" ]]; then
            echo "::error::smoke-check did not succeed (${{ needs.smoke-check.result }})"
            exit 1
          fi
          bn="${{ needs.build-niagara.result }}"
          if [[ "$bn" == "failure" || "$bn" == "cancelled" ]]; then
            echo "::error::build-niagara $bn"
            exit 1
          fi
          # build-niagara may legitimately skip only when the self-hosted runner
          # is intentionally disabled (NIAGARA_BUILD_ENABLED unset) or the PR is
          # from a fork (guarded out for signing-machine safety). Any other skip
          # means the compile/sign gate silently did not run — fail rather than
          # let uncompiled code ride auto-merge into a signed release.
          if [[ "$bn" == "skipped" ]]; then
            runner_enabled="${{ vars.NIAGARA_BUILD_ENABLED }}"
            fork_pr="false"
            if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              fork_pr="true"
            fi
            if [[ "$runner_enabled" == "true" && "$fork_pr" == "false" ]]; then
              echo "::error::build-niagara was skipped even though the Niagara runner is enabled and this is not a fork PR — the compile/sign gate did not run."
              exit 1
            fi
            echo "build-niagara skipped (runner enabled: '$runner_enabled', fork PR: $fork_pr) — accepted."
          fi
          echo "CI gate passed (build-niagara: $bn)."
