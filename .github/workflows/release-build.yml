name: Build, Sign & Release Niagara Modules

# Builds and officially-signs the four axCommunity module parts on a self-hosted
# Windows runner, verifies each jar's signer against the trusted-fingerprint
# allowlist, attaches them to the GitHub Release, and publishes them to this
# repo's GitHub Packages Maven registry.
#
# COMPATIBILITY: the runner must compile against the OLDEST supported Niagara
# (4.10.x) so the module.xml dependency stamps stay low and the jars load on
# 4.10 through 4.15+. Signing uses the JDK's jarsigner against the
# "S-Tier Building Automation llc" Sectigo cert in the Windows-MY store.
#
# Called by release-please.yml when a Release is created; also runnable manually
# (workflow_dispatch) to (re)build assets for an existing release tag.
#
# Runner requirements: a self-hosted runner labelled `niagara-build` with a
# Niagara 4.10.x install, a full JDK 8 (with jarsigner), and the signing cert
# available. Optional repo variables override the defaults: NIAGARA_HOME,
# NIAGARA_USER_HOME, NIAGARA_JDK_HOME, NIAGARA_SIGNING_ALIAS, NIAGARA_SIGNING_TSA.
# Optional secret SAFENET_PIN if the key is token-backed.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v22.2.3)'
        required: true
        type: string
      version:
        description: 'Module version without the v prefix (e.g. 22.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v22.2.3)'
        required: true
        type: string
      version:
        description: 'Module version without the v prefix (e.g. 22.2.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TRUSTED_FINGERPRINTS_FILE: cert/trusted-signer-fingerprints.txt

jobs:
  build-sign:
    name: Build, sign, verify, publish
    runs-on: [self-hosted, Windows, X64, niagara-build]
    timeout-minutes: 45
    env:
      # Compile against the OLDEST supported Niagara so jars stay forward-compatible.
      NIAGARA_HOME: ${{ vars.NIAGARA_HOME || 'C:\TAC\niagara-4.10.11.12' }}
      NIAGARA_USER_HOME: ${{ vars.NIAGARA_USER_HOME }}
      # Official signing via jarsigner against the Windows-MY cert store (no
      # keystore file; the cert is read from the runner's Windows store by alias).
      NIAGARA_SIGNING_ALIAS: ${{ vars.NIAGARA_SIGNING_ALIAS || 'S-Tier Building Automation llc' }}
      # RFC-3161 timestamp authority so signatures remain valid past cert expiry.
      NIAGARA_SIGNING_TSA: ${{ vars.NIAGARA_SIGNING_TSA || 'http://timestamp.digicert.com' }}
    steps:
      - name: Validate inputs
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INPUT_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Unexpected release tag: $env:INPUT_TAG (expected vX.Y.Z)"
          }
          if ($env:INPUT_VERSION -notmatch '^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Unexpected version: $env:INPUT_VERSION"
          }

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve signing JDK (jarsigner)
        shell: pwsh
        run: |
          # jarsigner lives in a full JDK, not a Niagara JRE. Prefer the runner's
          # JAVA_HOME if it has jarsigner, then the NIAGARA_JDK_HOME repo var.
          $jdk = $null
          foreach ($cand in @($env:JAVA_HOME, '${{ vars.NIAGARA_JDK_HOME }}')) {
            if (-not [string]::IsNullOrWhiteSpace($cand) -and (Test-Path (Join-Path $cand 'bin\jarsigner.exe'))) { $jdk = $cand; break }
          }
          if (-not $jdk) {
            throw "No JDK 8 with jarsigner found. Set the NIAGARA_JDK_HOME repo var (or JAVA_HOME) to a full JDK 8 on the runner."
          }
          Write-Host "Signing JDK: $jdk"
          "JAVA_HOME=$jdk" >> $env:GITHUB_ENV
          "SIGNING_JDK_HOME=$($jdk -replace '\\','/')" >> $env:GITHUB_ENV

      - name: Validate Niagara + signing prerequisites
        shell: pwsh
        run: |
          if (-not (Test-Path $env:NIAGARA_HOME)) { throw "NIAGARA_HOME missing: $env:NIAGARA_HOME" }
          $jre = Join-Path $env:NIAGARA_HOME 'jre\bin\java.exe'
          if (-not (Test-Path $jre)) { throw "Niagara JRE missing: $jre" }
          $cert = Get-ChildItem Cert:\CurrentUser\My, Cert:\LocalMachine\My -ErrorAction SilentlyContinue |
            Where-Object { $_.Subject -like '*S-Tier Building Automation*' } | Select-Object -First 1
          if (-not $cert) {
            throw "Signing cert 'S-Tier Building Automation llc' not found in the Windows store. If token-backed, connect the eToken."
          }
          Write-Host "Signing cert: $($cert.Subject) (expires $($cert.NotAfter))"

      - name: Verify checked-out version matches the tag
        shell: pwsh
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          # Match the version-bearing line specifically (not any line mentioning
          # the release-please marker — the surrounding comment may too).
          $line = Select-String -Path N4/vendor.gradle -Pattern "version\s*=\s*'[^']+'" | Select-Object -First 1
          if (-not $line) { throw "No 'version = ...' line in N4/vendor.gradle" }
          if ($line.Line -notmatch [regex]::Escape($env:EXPECTED)) {
            throw "N4/vendor.gradle version does not match release version '$env:EXPECTED': $($line.Line.Trim())"
          }
          Write-Host "Version OK: $($line.Line.Trim())"

      - name: Write N4/gradle.properties.local
        shell: pwsh
        working-directory: N4
        run: |
          # Forward slashes throughout — a .properties file treats backslash as an
          # escape char, so a Windows path with \ would be silently corrupted.
          # Official signing: jarsigner against the Windows-MY store (keystore=NONE,
          # cert selected by alias). No storepass for a Windows store cert; the
          # SafeNet middleware prompts/uses SAFENET_PIN if the key is token-backed.
          $lines = @(
            "niagara_home=$($env:NIAGARA_HOME -replace '\\','/')",
            "signing.keystore=NONE",
            "signing.storetype=Windows-MY",
            "signing.alias=$env:NIAGARA_SIGNING_ALIAS",
            "signing.tsa=$env:NIAGARA_SIGNING_TSA",
            "signing.jdkHome=$env:SIGNING_JDK_HOME"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:NIAGARA_USER_HOME)) {
            $lines += "niagara_user_home=$($env:NIAGARA_USER_HOME -replace '\\','/')"
          }
          Set-Content -Path gradle.properties.local -Value $lines -Encoding ASCII

      - name: Assemble + sign module parts
        shell: pwsh
        working-directory: N4
        # SAFENET_PIN is scoped to this step only (not the whole job) — it is read
        # ambiently by the SafeNet middleware during signing when the key is
        # token-backed; no other step needs it.
        env:
          SAFENET_PIN: ${{ secrets.SAFENET_PIN }}
        # clean and assemble as separate invocations: with the Gradle 4.10.x
        # toolchain a combined `clean assemble` can run clean out of order.
        run: |
          .\gradlew.bat clean --no-daemon --console=plain
          .\gradlew.bat assemble --no-daemon --console=plain

      - name: Verify jar signatures against trusted fingerprints
        id: verify
        shell: pwsh
        run: |
          $keytool = Join-Path $env:NIAGARA_HOME 'jre\bin\keytool.exe'
          # JAVA_HOME is pinned to a full JDK 8 with jarsigner by the earlier
          # 'Resolve signing JDK (jarsigner)' step.
          $jarsigner = Join-Path $env:JAVA_HOME 'bin\jarsigner.exe'
          if (-not (Test-Path $jarsigner)) { throw "jarsigner not found under JAVA_HOME ($env:JAVA_HOME); a full JDK 8 is required (see the 'Resolve signing JDK' step)." }
          if (-not (Test-Path $env:TRUSTED_FINGERPRINTS_FILE)) {
            throw "$($env:TRUSTED_FINGERPRINTS_FILE) is missing — cannot verify signers."
          }
          $trusted = Get-Content $env:TRUSTED_FINGERPRINTS_FILE |
            ForEach-Object { ($_ -replace '#.*$', '').Trim() } |
            Where-Object { $_ } |
            ForEach-Object { ($_ -replace '[:\s]', '').ToUpper() }
          if (-not $trusted) { throw "No fingerprints in $($env:TRUSTED_FINGERPRINTS_FILE)" }

          $fail = $false
          $jars = @()
          foreach ($p in 'rt', 'wb', 'ux', 'doc') {
            $jar = "N4/axCommunity-$p/build/libs/axCommunity-$p.jar"
            if (-not (Test-Path $jar)) { Write-Host "::error::missing $jar"; $fail = $true; continue }
            # keytool -printcert below only reads the signature BLOCK; jarsigner
            # -verify re-checks every jar entry against the signature, and -strict
            # turns any verification warning into a non-zero exit. Require both a
            # clean exit and the explicit success line (an unsigned jar can exit 0).
            $jsOut = & $jarsigner -verify -strict -certs $jar 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $jsOut -notmatch 'jar verified\.') {
              Write-Host "::error::jarsigner -verify -strict failed for $jar — the jar is unsigned, was modified after signing, or has verification warnings:"
              Write-Host $jsOut
              $fail = $true; continue
            }
            $out = & $keytool -printcert -jarfile $jar 2>&1 | Out-String
            $rawFps = [regex]::Matches($out, 'SHA256:\s*([0-9A-Fa-f:]+)') |
              ForEach-Object { $_.Groups[1].Value.Trim() } | Select-Object -Unique
            if (-not $rawFps) { Write-Host "::error::no SHA256 fingerprint for $jar"; $fail = $true; continue }
            # Fail closed: EVERY signer cert fingerprint printed for this jar must
            # be allowlisted — a second signer with an unknown cert must abort the
            # release, not ride through on the strength of the first match.
            $jarOk = $true
            foreach ($raw in $rawFps) {
              $fp = ($raw -replace '[:\s]', '').ToUpper()
              if ($trusted -contains $fp) {
                Write-Host "OK  $jar  $raw"
              } else {
                Write-Host "::error::$jar has an untrusted signer cert (SHA256: $raw) — every signer fingerprint must be in $($env:TRUSTED_FINGERPRINTS_FILE); add it there if the cert was rotated."
                $jarOk = $false
              }
            }
            if ($jarOk) { $jars += (Resolve-Path $jar).Path } else { $fail = $true }
          }
          if ($fail) { throw "Signature verification failed — aborting release." }
          $jars -join "`n" | Set-Content -Path verified-jars.txt -Encoding ASCII

      - name: Attach signed jars to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jars = Get-Content verified-jars.txt | Where-Object { $_ }
          gh release upload "${{ inputs.tag }}" @jars --clobber

      - name: Publish to GitHub Packages (Maven)
        shell: pwsh
        working-directory: N4
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # GitHub Packages' Maven registry rejects re-publishing an existing
          # version (HTTP 409, or 422 Unprocessable Entity). Use --continue so all
          # four parts are attempted even if some already exist; then tolerate the
          # run only when EVERY upload failure is a duplicate-version status —
          # any other error (auth, network) still fails the job.
          $pubOut = .\gradlew.bat publish --continue --console=plain --stacktrace 2>&1
          $code = $LASTEXITCODE
          $pubOut | ForEach-Object { Write-Host $_ }   # echo Gradle output to the log
          if ($code -ne 0) {
            $text = $pubOut -join "`n"
            $codes = [regex]::Matches($text, 'Received status code (\d+)') | ForEach-Object { $_.Groups[1].Value }
            $nonDup = $codes | Where-Object { $_ -ne '409' -and $_ -ne '422' }
            if (($codes.Count -gt 0) -and ($nonDup.Count -eq 0)) {
              Write-Host "::notice::All publish targets already exist (status $((($codes | Select-Object -Unique) -join ', '))) — treating as success."
              exit 0   # else the step inherits gradle's non-zero $LASTEXITCODE
            } else {
              exit $code
            }
          }

      - name: Clean up working file
        if: always()
        shell: pwsh
        run: Remove-Item verified-jars.txt -ErrorAction SilentlyContinue
